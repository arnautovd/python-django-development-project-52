services:
  - type: web
    name: hexlet-code
    runtime: python
    plan: free
    buildCommand: uv sync --frozen && uv run python manage.py collectstatic --noinput && uv run python manage.py migrate
    startCommand: uv run gunicorn --bind 0.0.0.0:$PORT task_manager.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hexlet-code-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: webserver

databases:
  - name: hexlet-code-db
    plan: free
