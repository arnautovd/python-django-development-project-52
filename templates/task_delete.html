{% extends "base.html" %}

{% block title %}Удаление задачи{% endblock %}

{% block content %}
<h1 class="mb-4">Удаление задачи</h1>
<p>Вы уверены, что хотите удалить задачу {{ object.name }}?</p>
<form method="post">
    {% csrf_token %}
    <button class="btn btn-danger" type="submit">Да, удалить</button>
    <a class="btn btn-secondary" href="{% url 'tasks' %}">Отмена</a>
</form>
{% endblock %}
