{% extends "base.html" %}
{% load django_bootstrap5 %}

{% block title %}Создать задачу{% endblock %}

{% block content %}
<h1 class="mb-4">Создать задачу</h1>
<form method="post" class="col-md-8">
    {% csrf_token %}
    {% bootstrap_form form %}

</form>
{% endblock %}
