{% extends "base.html" %}
{% load django_bootstrap5 %}

{% block title %}Изменить пользователя{% endblock %}

{% block content %}
<h1 class="mb-4">Изменить пользователя</h1>
<form method="post" class="col-md-6">
    {% csrf_token %}
    {% bootstrap_form form %}
    <button class="btn btn-primary" type="submit">Изменить</button>
</form>
{% endblock %}
