{% extends "base.html" %}

{% block title %}Метки{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1>Метки</h1>
    <a class="btn btn-primary" href="{% url 'label_create' %}">Создать метку</a>
</div>

<div class="table-responsive">
    <table class="table table-striped align-middle">
        <thead>
            <tr>
                <th scope="col">Имя</th>
                <th scope="col">Дата создания</th>
                <th scope="col">Действия</th>
            </tr>
        </thead>
        <tbody>
            {% for label in labels %}
                <tr>
                    <td>{{ label.name }}</td>
                    <td>{{ label.created_at|date:"d.m.Y H:i" }}</td>
                    <td>
                        <a href="{% url 'label_update' label.pk %}">Изменить</a>
                        <a href="{% url 'label_delete' label.pk %}">Удалить</a>
                    </td>
                </tr>
            {% empty %}
                <tr>
                    <td colspan="3">Метки отсутствуют.</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
