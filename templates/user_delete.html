{% extends "base.html" %}

{% block title %}Удаление пользователя{% endblock %}

{% block content %}
<h1 class="mb-4">Удаление пользователя</h1>
<p>Вы уверены, что хотите удалить пользователя {{ object.username }}?</p>
<form method="post">
    {% csrf_token %}
    <button class="btn btn-danger" type="submit">Да, удалить</button>
    <a class="btn btn-secondary" href="{% url 'users' %}">Отмена</a>
</form>
{% endblock %}
